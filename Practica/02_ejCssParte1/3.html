<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Lista con Imágenes</title>
    <style>
        ul {
            list-style: none;
            padding-left: 0;
        }

        ul li {
            padding-left: 28px;
            background-image: url("https://e7.pngegg.com/pngimages/601/285/png-clipart-red-and-white-check-bullet-google-docs-bullet-points-angle-text-thumbnail.png");
            background-repeat: no-repeat;
            background-position: left center;
            background-size: 18px;
        }
    </style>
</head>
<body>
    <h2>Mi lista con viñetas personalizadas</h2>
    <ul>
        <li>Elemento uno</li>
        <li>Elemento dos</li>
        <li>Elemento tres</li>
        <li>Elemento cuatro</li>
    </ul>
</body>
</html>
