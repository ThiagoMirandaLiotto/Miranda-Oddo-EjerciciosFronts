<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Animación Hover</title>
    <style>
        .caja {
            width: 150px;
            height: 150px;
            background-color: rgb(167, 76, 43);
            text-align: center;
            padding-top: 60px;
            border-radius: 8px;
            cursor: pointer;
        }

        .caja:hover {
            transform: scale(1.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
            background-color: tomato;
        }
    </style>
</head>
<body>
    <div class="caja">Pasa el mouse!</div>
</body>
</html>
