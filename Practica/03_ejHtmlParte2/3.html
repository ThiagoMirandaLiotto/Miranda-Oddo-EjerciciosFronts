<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Registro</title>
</head>
<body>
    <h1>Crear Cuenta</h1>
    <form>
        <div>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
        </div>
        <br>
        <div>
            <label for="apellido">Apellido:</label><br>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido">
        </div>
        <br>
        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com">
        </div>
        <br>
        <div>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" placeholder="Elegí una contraseña">
        </div>
        <br>
        <div>
            <label for="password2">Confirmar Contraseña:</label><br>
            <input type="password" id="password2" name="password2" placeholder="Repetí la contraseña">
        </div>
        <br>
        <div>
            <button type="submit">Registrarse</button>
        </div>
        <br>
        <p>Ya tenss cuenta? <a href="2.html">Iniciá sesión aquí</a></p>
    </form>
</body>
</html>
