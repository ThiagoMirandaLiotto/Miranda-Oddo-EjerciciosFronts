<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Formulario de Contacto</title>
</head>
<body>
    <h1>Formulario de Contacto</h1>
    <form>
        <div>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" maxlength="30" placeholder="Tu nombre">
        </div>
        <br>
        <div>
            <label for="apellido">Apellido:</label><br>
            <input type="text" id="apellido" name="apellido" maxlength="30" placeholder="Tu apellido">
        </div>
        <br>
        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="tucorreo@ejemplo.com">
        </div>
        <br>
        <div>
            <label for="asunto">Asunto:</label><br>
            <select id="asunto" name="asunto">
                <option value="">-- Seleccioná un asunto --</option>
                <option value="presupuesto">Pedir presupuesto</option>
                <option value="cita">Solicitar cita previa</option>
                <option value="otros">Otros</option>
            </select>
        </div>
        <br>
        <div>
            <p>Cómo nos ha escogido? (podes elegir más de una)</p>
            <input type="checkbox" id="amigo" name="como" value="amigo">
            <label for="amigo">Un amigo</label><br>
            <input type="checkbox" id="google" name="como" value="google">
            <label for="google">Googleando</label><br>
            <input type="checkbox" id="redes" name="como" value="redes">
            <label for="redes">Redes sociales</label><br>
            <input type="checkbox" id="otros" name="como" value="otros">
            <label for="otros">Otros</label>
        </div>
        <br>
        <div>
            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" maxlength="300" rows="5" cols="40"></textarea>
        </div>
        <br>
        <div>
            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto los términos y condiciones (obligatorio)</label>
        </div>
        <br>
        <div>
            <button type="submit">Enviar</button>
        </div>
    </form>
</body>
</html>
